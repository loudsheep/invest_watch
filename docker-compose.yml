# Secrets come only from .env (copy .env.example). A missing variable stops compose
# with an error instead of falling back to a value baked into this file.
# Infrastructure ports are published on 127.0.0.1 only; the dashboard, API and
# demo-sites stay reachable from the network for the demo.

x-database-env: &database-env
  DATABASE_URL: postgresql://investwatch:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, copy .env.example to .env}@postgres:5432/investwatch

x-redis-env: &redis-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set}@redis:6379

x-storage-env: &storage-env
  S3_ENDPOINT: http://garage:3900
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set}
  S3_BUCKET: ${S3_BUCKET:-investwatch-evidence}

x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemma3:4b}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: investwatch
      POSTGRES_USER: investwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:47432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    ports:
      - "127.0.0.1:47379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for evidence (HTML, screenshots). MinIO's
  # newer releases dropped the open-source web console / changed licensing,
  # so we use Garage instead - same project also uses it, see garage/init.sh.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is not set}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is not set}
    ports:
      - "127.0.0.1:47900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  garage-init:
    image: curlimages/curl:8.11.1
    depends_on:
      - garage
    entrypoint: /bin/sh
    command: ["/init.sh"]
    environment:
      <<: *storage-env
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is not set}
    volumes:
      - ./garage/init.sh:/init.sh:ro
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:47434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["-c", "ollama pull ${LLM_MODEL:-gemma3:4b}"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:47888:8080"
    volumes:
      - ./infra/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      INSTANCE_NAME: InvestWatch-SearXNG
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is not set}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy-1:
    image: vimagick/tinyproxy:latest
    profiles:
      - proxy
    ports:
      - "127.0.0.1:47118:8118"
    environment:
      - TINYPROXY_TIMEOUT=600

  proxy-2:
    image: vimagick/tinyproxy:latest
    profiles:
      - proxy
    ports:
      - "127.0.0.1:47119:8118"
    environment:
      - TINYPROXY_TIMEOUT=600

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-env
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?ANALYST_PASSWORD is not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "47800:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env, *storage-env, *llm-env]
      PROXY_URLS: ${PROXY_URLS:-}
      SEARXNG_URL: http://searxng:8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:47173,http://localhost:5173}
      DEBUG: "false"
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  scraper-worker:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env, *storage-env]
      PROXY_URLS: ${PROXY_URLS:-}
      SEARXNG_URL: http://searxng:8080
      FETCH_ALLOWED_PRIVATE_HOSTS: ${FETCH_ALLOWED_PRIVATE_HOSTS:-demo-sites,nordik-brokr-demo.local}
      DEBUG: "false"
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro

  ai-worker:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      <<: [*database-env, *redis-env, *llm-env]
      HF_HOME: /app/models/hf
      DEBUG: "false"
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ai_models:/app/models

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env]
      DEBUG: "false"
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "47173:5173"
    environment:
      - VITE_API_URL=http://localhost:47800
      - VITE_DEMO_SITES_URL=http://localhost:47080
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src:ro

  demo-sites:
    build:
      context: ./demo-sites
    ports:
      - "47080:8080"
    environment:
      - PORT=8080
    networks:
      default:
        aliases:
          - nordik-brokr-demo.local

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  ollama_data:
  ai_models:

networks:
  default:
    name: investwatch
