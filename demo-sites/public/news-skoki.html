<h1>Skoki narciarskie: Polacy na podium w Lillehammer</h1>

<p>Polscy skoczkowie stanęli dziś na podium konkursu indywidualnego w Lillehammer. Zwycięzca wylądował na 138 metrze i zyskał przewagę po pierwszej serii.</p>
<p>W niedzielę kolejny konkurs, tym razem drużynowy. Transmisja na żywo od godziny 16.</p>
