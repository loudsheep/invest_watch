name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, scraper, ai, scheduler]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv ruff pip-audit
      - name: Install common + ${{ matrix.service }}
        run: uv pip install --system -e common -e services/${{ matrix.service }}
      - name: Ruff lint
        run: ruff check common services/${{ matrix.service }}
      - name: pip-audit
        run: |
          uv pip compile services/${{ matrix.service }}/pyproject.toml common/pyproject.toml -q -o /tmp/req.txt
          pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - name: Tests
        run: |
          uv pip install --system pytest
          if [ -d services/${{ matrix.service }}/tests ]; then pytest services/${{ matrix.service }}/tests; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned to a commit: release tags of this action have been rewritten in the past.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
