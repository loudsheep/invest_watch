# Seed phrases per module, used for topic centroids (classifier fallback) and
# for YouTube/open-web discovery queries. Extend freely without touching code.

m1_finfluencer:
  topic_phrases:
    - "kod promocyjny broker inwestycyjny"
    - "link afiliacyjny konto maklerskie"
    - "bonus za rejestracje u brokera"
    - "współpraca reklamowa z firmą inwestycyjną"
  discovery_queries:
    - "kod promocyjny broker forex"
    - "link w bio broker inwestycyjny"
    - "#reklama broker"

m2_risk_disclosure:
