# Production stack for Coolify (see docs/DEPLOY.md, ADR-0022).
# No bind mounts and no published ports: configuration is baked into the images,
# public traffic goes through the domains assigned to services in Coolify.
# The LLM is an external OpenAI-compatible endpoint, set with LLM_BASE_URL.

x-database-env: &database-env
  DATABASE_URL: postgresql://investwatch:${POSTGRES_PASSWORD:?}@postgres:5432/investwatch

x-redis-env: &redis-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379

x-storage-env: &storage-env
  S3_ENDPOINT: http://garage:3900
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:-investwatch-evidence}

x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:?}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:?}

services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: investwatch
      POSTGRES_USER: investwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    build:
      context: .
      dockerfile: infra/docker/garage.Dockerfile
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  garage-init:
    build:
      context: .
      dockerfile: infra/docker/garage-init.Dockerfile
    depends_on:
      - garage
    environment:
      <<: *storage-env
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    restart: "no"
    exclude_from_hc: true

  searxng:
    build:
      context: .
      dockerfile: infra/docker/searxng.Dockerfile
    restart: unless-stopped
    environment:
      INSTANCE_NAME: InvestWatch-SearXNG
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-env
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    restart: "no"
    exclude_from_hc: true

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env, *storage-env, *llm-env]
      PROXY_URLS: ${PROXY_URLS:-}
      SEARXNG_URL: http://searxng:8080
      JWT_SECRET: ${JWT_SECRET:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  scraper-worker:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env, *storage-env]
      PROXY_URLS: ${PROXY_URLS:-}
      SEARXNG_URL: http://searxng:8080
      FETCH_ALLOWED_PRIVATE_HOSTS: demo-sites,nordik-brokr-demo.local
      DEBUG: "false"

  ai-worker:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env, *llm-env]
      HF_HOME: /app/models/hf
      DEBUG: "false"
    volumes:
      - ai_models:/app/models

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database-env, *redis-env]
      DEBUG: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?}
    restart: unless-stopped
    depends_on:
      - api

  demo-sites:
    build:
      context: ./demo-sites
    restart: unless-stopped
    environment:
      PORT: "8080"
    networks:
      default:
        aliases:
          - nordik-brokr-demo.local

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  ai_models:
