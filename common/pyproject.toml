[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investwatch-common"
version = "0.1.0"
dependencies = [
    "pydantic[email]>=2.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "redis>=5.0",
    "pgvector>=0.2.4",
    "structlog>=23.0",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["investwatch_common"]
